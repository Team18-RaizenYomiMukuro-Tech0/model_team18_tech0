# PRレビュー規定 §3-1・§3-4 のパスに当たる変更があれば needs-human を付ける（actions/labeler）。
# 対象の正本は 00_ルール/PRレビュー規定.md。規定を変えたらここも合わせる。
needs-human:
  - changed-files:
      - any-glob-to-any-file:
          # §3-1 5文書（02_プロジェクト/<案件>/ の要求・要件・仕様・設計・テスト設計）
          - '02_プロジェクト/*/要求.md'
          - '02_プロジェクト/*/要件.md'
          - '02_プロジェクト/*/仕様.md'
          - '02_プロジェクト/*/設計.md'
          - '02_プロジェクト/*/テスト設計.md'
          # §3-4 ルールそのもの
          - 'CLAUDE.md'
          - '.claude/agents/**'
          - '00_ルール/**'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/pull_request_template.md'
          - '.github/CODEOWNERS'
          - '.github/labeler.yml'
          # §3-4 レビューや要約の動き方を決める指示文（ルーチンは main のこれらを毎回読む）
          - 'scripts/scheduled/**'
          - '01_ナレッジ/weekly-digest-prompt.md'
  # 上と別の条件（トップの項目は OR）。§3-4 .github/workflows/ の変更。ただし dashboard-*.yml だけは例外
  # （その中身の権限は pr-mechanical-checks.yml の dashboard-workflow-guard が別に調べる）
  - changed-files:
      - all-globs-to-any-file:
          - '.github/workflows/**'
          - '!.github/workflows/dashboard-*.yml'

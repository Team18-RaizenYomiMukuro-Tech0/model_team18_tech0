# API（backend/）を Azure Functions（Flex 従量課金）にデプロイする
name: Build and deploy Python project to Azure Function App - func-gen13-step3-5181
on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/main_func-gen13-step3-5181.yml'
  workflow_dispatch:
env:
  PYTHON_VERSION: '3.14'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # デプロイの前にテストを通す。秘密は渡さない（GIFTIA_DB_* が無いので DB のテストは skipped）
      - name: Test (pytest)
        run: python -m pytest -q -rs
      - name: Zip artifact for deployment
        run: zip -qr ../release.zip . -x 'venv/*' '.pytest_cache/*' '*/__pycache__/*'
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-app
          path: release.zip
  deploy:
    runs-on: ubuntu-latest
    needs: build
    # artifact の取得は Actions の実行トークンで足りる。GITHUB_TOKEN には contents: read だけ渡す
    permissions:
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-app
      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: 'func-gen13-step3-5181'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0A958877ED1F4436B578596688AECABE }}
          sku: 'flexconsumption'
          remote-build: true

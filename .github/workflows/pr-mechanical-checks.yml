# PR の機械判定（PRレビュー規定 §3-1/§3-4、§4 の一部を決定的に調べる）。
#  - labeler: 規定のパスに当たる変更があれば needs-human を付ける
#  - template-check: 「対応する文書の ID」の記入と、チェック欄がすべて [x] かを調べる
# トリガーは pull_request（pull_request_target は使わない: 外部 PR のコードに書き込み権限を渡さないため）。
name: PR 機械チェック

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

concurrency:
  group: pr-mechanical-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  labeler:
    name: 要人判断パスのラベル
    # edited（本文の編集）ではパスは変わらない
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          # 人や Claude が付けた needs-human を勝手に外さない
          sync-labels: false

  template-check:
    name: テンプレート記入
    # Draft（作業中）は調べない。Draft を解除（ready_for_review）したときに調べる
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # 本文は信頼できない入力。スクリプトに直接埋め込まず環境変数で渡す
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: 本文を調べる
        id: check
        run: |
          problems=""
          body="$(printf '%s' "$PR_BODY" | tr -d '\r')"

          # 「## 対応する文書の ID」の節（次の ## まで）
          id_section="$(printf '%s\n' "$body" | awk '/^## 対応する文書の ID/{f=1;next} /^## /{f=0} f')"
          # テンプレートのままの見出し行と例文（全角括弧の注記）を除いて、中身が残るか
          id_filled="$(printf '%s\n' "$id_section" \
            | sed -E 's/（[^）]*）//g; s/^[[:space:]]*-?[[:space:]]*要件 \/ 仕様 \/ テスト[[:space:]]*[:：]?//' \
            | tr -d '[:space:]')"
          if [ -z "$id_filled" ]; then
            problems="${problems}- 「対応する文書の ID」が未記入です（例: F-01, I-02。Week 0 は「環境構築 章13」）。\n"
          fi

          # 「## チェック」の節（次の ## まで）のチェック欄
          check_section="$(printf '%s\n' "$body" | awk '/^## チェック/{f=1;next} /^## /{f=0} f')"
          total="$(printf '%s\n' "$check_section" | grep -cE '^[[:space:]]*- \[[ xX]\]' || true)"
          unchecked="$(printf '%s\n' "$check_section" | grep -E '^[[:space:]]*- \[ \]' || true)"
          if [ "$total" -eq 0 ]; then
            problems="${problems}- 「チェック」欄が見つかりません（テンプレートの節を消していませんか）。\n"
          elif [ -n "$unchecked" ]; then
            problems="${problems}- 未チェックの項目があります:\n"
            while IFS= read -r line; do
              [ -n "$line" ] && problems="${problems}  ${line}\n"
            done <<< "$unchecked"
          fi

          {
            echo "failed=$([ -n "$problems" ] && echo true || echo false)"
            echo "problems<<EOF_PROBLEMS"
            printf '%b' "$problems"
            echo "EOF_PROBLEMS"
          } >> "$GITHUB_OUTPUT"

      - name: 不足をコメントする（満たしたら前のコメントを消す）
        # フォークからの PR などでトークンが読み取り専用でも、チェック結果自体は失敗として残す
        continue-on-error: true
        env:
          FAILED: ${{ steps.check.outputs.failed }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
        run: |
          marker='<!-- pr-mechanical-check -->'
          existing="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)"
          if [ "$FAILED" = "true" ]; then
            body="$(printf '%s\n**PR 機械チェック: 不足があります**\n\n%s\n\nPR 本文（PR テンプレート）を直すと、このチェックは自動でやり直されます。' "$marker" "$PROBLEMS")"
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
            fi
          elif [ -n "$existing" ]; then
            gh api -X DELETE "repos/$REPO/issues/comments/$existing" >/dev/null
          fi

      - name: 不足があれば失敗にする
        if: steps.check.outputs.failed == 'true'
        run: |
          echo "::error::PR テンプレートの記入に不足があります。PR のコメントを見てください。"
          exit 1

# PR ごとのテストと型の確認（NF-32・テスト設計 E-09）。#554
#  - backend: pytest・mypy --strict・ruff check
#  - frontend: npm test・eslint・tsc
#  - 秘密（Secrets）は使わない。DB につながない（GIFTIA_DB_* を設定しないので、DB のテストは skipped になる）
#  - pull_request（PR の変更を動かす）。pull_request_target は使わない
name: PR テスト

on:
  pull_request:

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 依存を入れる
        run: python -m pip install -r backend/requirements-dev.txt

      - name: backend pytest
        working-directory: backend
        run: python -m pytest -q -rs

      - name: backend mypy --strict
        run: python -m mypy --strict backend

      - name: backend ruff
        working-directory: backend
        run: python -m ruff check .

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存を入れる
        run: npm ci

      - name: frontend test
        run: npm test

      - name: frontend lint
        run: npx eslint . --max-warnings 0

      - name: frontend tsc
        run: npx tsc --noEmit

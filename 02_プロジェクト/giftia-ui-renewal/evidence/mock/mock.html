<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giftia レビュー用モック（案A）</title>
<style>
:root{--bg:#f4f1ee;--paper:#fff;--ink:#3a3331;--sub:#7a6f6a;--line:#e8dfd9;--peach:#fdeee6;--coral:#ee6c4d;--coral-d:#d4553a;--sage:#e6ebdd;--sage-d:#5d7a4e;--green:#6f8a5a;--err:#b3261e;--errbg:#fdecea;--note:#fff3a8;
 --surf:#fff;--sel:#fff6f2;--muted:#f5f2ef;--imgbg:#faf7f4;--bd2:#8a7d75;--btn-sel:#b8422a;--btn-sel-d:#8f321e;--ink2:#5c514d;--badge-bg:#fbe3d9;--badge-ink:#a2402a;
 --hero-bg:var(--peach);--hero-ink:var(--ink);--hero-sub:var(--sub);--rl:12px;--rm:8px;--shadow:0 1px 2px rgba(0,0,0,.04);--shadow-h:0 2px 6px rgba(0,0,0,.08);--gold:#c9a227}
/* クリスマステーマ: 色・角丸・影はここ1か所（body.xmas を外すと淡色に戻る） */
body.xmas{--bg:#f2e9dc;--paper:#fffaf2;--surf:#fffdf9;--muted:#f2e9db;--peach:#f8e8da;--line:#e3d3bb;--ink:#2a2120;--ink2:#4a3c37;--sub:#67554d;
 --coral:#b3261e;--coral-d:#8c1c16;--green:#1f5e3b;--sage:#e1eee4;--sage-d:#1f5e3b;--sel:#fdeee8;--imgbg:#f7efe4;--bd2:#8f7d6d;--btn-sel:#b3261e;--btn-sel-d:#8c1c16;--badge-bg:#f7dcd5;--badge-ink:#8c1c16;--errbg:#fbe9e6;--err:#a31f18;
 --hero-bg:linear-gradient(135deg,#1f5e3b 0%,#287249 100%);--hero-ink:#ffffff;--hero-sub:#f6ebcc;--rl:20px;--rm:14px;--shadow:0 4px 16px rgba(60,35,20,.10);--shadow-h:0 10px 26px rgba(60,35,20,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
#bar{position:sticky;top:0;z-index:30;background:#2f2a28;color:#fff;padding:8px 12px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
#bar b{color:#ffd9cc}
#bar .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#bar button{background:#4a4340;border:1px solid #6b625e;color:#fff;border-radius:6px;padding:3px 9px;font-size:12px}
#bar button[aria-pressed=true]{background:var(--coral);border-color:var(--coral)}
#bar label{display:flex;gap:4px;align-items:center}
#stage{padding:14px 8px 40px;display:flex;justify-content:center}
#app{container-type:inline-size;width:100%;max-width:1280px;background:var(--paper);border:1px solid var(--line);border-radius:var(--rl);overflow:clip;position:relative;min-height:70vh}
#app.w375{max-width:375px}
.sp{display:none;font:600 10px/1 monospace;background:#e3efff;color:#1a4fa0;border:1px solid #9bbcf0;border-radius:4px;padding:2px 4px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.show-sp .sp{display:inline-block}
.sticky{display:none;background:var(--note);color:#4a3d00;border:1px solid #d9c24a;border-radius:4px;padding:5px 8px;font-size:12px;line-height:1.45;margin:6px 0;box-shadow:1px 2px 0 rgba(0,0,0,.12);max-width:34em;text-align:left;font-weight:400}
.sticky::before{content:"📌 仕様に書かれていません：";font-weight:700}
body.show-note .sticky{display:block}
header.top{position:sticky;top:var(--barh,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;color:var(--ink);display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;min-height:44px}
.logo i{display:inline-block;width:22px;height:22px;border:2px solid var(--coral);border-radius:4px;position:relative}
.logo i::after{content:"";position:absolute;left:8px;top:-2px;width:2px;height:22px;background:var(--coral)}
.hsearch{display:flex;flex:1 1 180px;max-width:420px;border:1px solid var(--bd2);border-radius:22px;overflow:hidden;background:var(--muted)}
.hsearch input{flex:1;min-width:0;border:0;padding:8px 14px;font:inherit;min-height:44px;background:var(--muted)}
.hsearch input::placeholder{color:#b5aaa4}
.spacer{flex:1}
.hbtn{position:relative;background:none;border:0;padding:6px 8px;border-radius:var(--rm);display:flex;gap:4px;align-items:center;font-size:13px;min-height:44px}
.hbtn:hover{background:var(--peach)}
.cnt{background:var(--coral);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;min-width:16px;text-align:center}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;background:#eee;color:#555}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a3331;color:#fff;padding:9px 16px;border-radius:var(--rm);font-size:13px;z-index:40;display:none;max-width:90%}
.toast.on{display:block}
main{padding:20px}
h1{font-size:20px;margin:0 0 4px}
h2.sec{font-size:15px;margin:22px 0 10px}
.hero{position:relative;background:var(--hero-bg);color:var(--hero-ink);border-radius:var(--rl);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;overflow:hidden}
.hero h1{font-size:28px;line-height:1.35;margin:0 0 8px}
.hero p{margin:0;color:var(--hero-sub);font-size:13px}
.hero svg{flex:0 0 150px;width:150px;height:auto}
@container (max-width:600px){.hero h1{font-size:21px}.hero svg{display:none}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:var(--rm);padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.tile[aria-pressed=true]{border:2px solid var(--coral);background:var(--sel);font-weight:700}
.tile .ic{font-size:22px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{justify-content:flex-start;padding-left:16px}
@container (max-width:600px){.tiles,.cats{grid-template-columns:repeat(2,1fr)}}
.ferr{color:var(--err);font-size:13px;margin-top:4px;font-weight:600;min-height:1.2em}
.bands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@container (max-width:600px){.bands{grid-template-columns:1fr}}
.budgetbox{background:var(--peach);border-radius:var(--rl);padding:14px 18px;margin-top:12px}
.budget{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.lb{font-weight:700;font-size:13px;display:block;margin-bottom:6px}
.primary{background:var(--coral);color:#fff;border:0;border-radius:var(--rm);padding:10px 22px;font-weight:700;min-height:44px}
.primary:not(:disabled):hover{background:var(--coral-d)}
.ghost{background:var(--surf);border:1px solid var(--bd2);border-radius:var(--rm);padding:8px 14px;min-height:44px}
.full{width:100%;text-align:center}
.msgbox{margin-top:16px;border-radius:var(--rm);padding:18px;text-align:center}
.msgbox.err{background:var(--errbg);color:var(--err)}
.msgbox.empty{background:var(--muted);color:var(--sub)}
.msgbox.init{background:var(--sage);color:var(--sage-d)}
.spinner{width:28px;height:28px;border:4px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.filters{background:var(--peach);border-radius:var(--rl);padding:14px 18px;display:grid;gap:10px}
.frow{display:flex;gap:14px 28px;flex-wrap:wrap;align-items:flex-start}
.fgrp{display:flex;flex-direction:column;gap:6px}
.fgrp b{font-size:12px}
.fbtns{display:flex;gap:8px;flex-wrap:wrap}
.fb{background:var(--surf);border:1px solid var(--line);border-radius:var(--rm);padding:6px 14px;font-size:13px;min-height:44px}
.fb[aria-pressed=true]{border:2px solid var(--coral);font-weight:700;padding:5px 13px}
.fb.txt{background:none;border:0;padding:6px 8px}
.notice{background:var(--sage);border-radius:var(--rm);padding:8px 14px;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.notice button{background:none;border:0;color:var(--coral-d);font-weight:700;min-height:44px;padding:0 6px}
.layout{display:grid;grid-template-columns:1fr;gap:16px;margin-top:14px}
@container (min-width:1000px){.layout{grid-template-columns:1fr 340px}}
.grid{display:grid;grid-template-columns:1fr;gap:14px;align-content:start}
@container (min-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
@container (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid.rec4{grid-template-columns:repeat(2,1fr)}
@container (min-width:760px){.grid.rec4{grid-template-columns:repeat(4,1fr)}}
.linkbtn{background:none;border:0;padding:6px 0;min-height:44px;font:inherit;font-weight:700;color:var(--coral);text-decoration:underline;cursor:pointer}
.card{border:1px solid var(--line);border-radius:var(--rl);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surf);position:relative}
.card.focus{border:2px solid var(--coral);padding:11px}
.card.sel{background:var(--sel)}
.topline{display:flex;gap:6px;align-items:center;min-height:24px;flex-wrap:wrap;padding-right:44px}
.rank{background:#3a3331;color:#fff;font-size:11px;border-radius:var(--rm);padding:1px 8px}
.badge{background:var(--badge-bg);color:var(--badge-ink);font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px}
.selbadge{background:var(--coral);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px}
.heart{position:absolute;right:6px;top:4px;background:none;border:0;font-size:20px;min-width:44px;min-height:44px;color:var(--sub)}
.heart[aria-pressed=true]{color:var(--coral)}
.imgwrap{position:relative;border-radius:var(--rm);overflow:hidden;background:var(--imgbg)}
.imgwrap svg{display:block;width:100%;height:96px}
.imgtag{position:absolute;right:4px;bottom:3px;font-size:10px;background:rgba(255,255,255,.85);border-radius:3px;padding:0 4px;color:var(--sub)}
button.name{background:none;border:0;padding:0;text-align:left;font-weight:700;min-height:44px;line-height:1.35}
.price{font-size:17px;font-weight:700}
.tax{font-size:12px;font-weight:400;color:var(--sub)}
.meta{font-size:12px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap}
.star{color:#e8a317}
.reason{font-size:13px;color:var(--ink2);margin:0}
.pick{margin-top:auto;display:flex;gap:8px;align-items:center;font-weight:600;min-height:44px;cursor:pointer;border:1px solid var(--line);border-radius:var(--rm);padding:6px 10px}
.pick input{width:20px;height:20px;accent-color:var(--coral)}
.detail{position:relative;border:1px solid var(--line);border-radius:var(--rl);padding:14px;display:flex;flex-direction:column;gap:8px;align-self:start;background:var(--surf)}
@container (max-width:999px){.detail:not(.open){display:none}}
.detail .imgwrap svg{height:150px}
.detail h3{margin:0;font-size:15px;padding-right:44px}
.detail dl{margin:0;font-size:12px}.detail dt{font-weight:700;margin-top:6px}.detail dd{margin:0;color:var(--ink2)}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.pager .pg{display:flex;gap:6px;align-items:center}
.pager button{min-width:44px;min-height:44px;border-radius:22px;border:0;background:none}
.pager button[aria-current=page]{background:var(--green);color:#fff;font-weight:700}
.chosen{margin-top:18px;border:2px solid var(--coral);border-radius:var(--rl);padding:12px;background:var(--sel)}
.chosen ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.chosen li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surf);border:1px solid var(--line);border-radius:var(--rm);padding:6px 10px}
.chosen li .nm{flex:1 1 160px}
.sharebar{position:sticky;bottom:0;background:var(--surf);border-top:2px solid var(--peach);padding:12px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px -20px -20px;z-index:5}
.overmsg{flex-basis:100%;color:var(--err);font-weight:600;font-size:13px}
.linkbox{flex-basis:100%;background:var(--sage);border-radius:var(--rm);padding:12px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkrow code{background:var(--surf);border:1px solid var(--line);border-radius:var(--rm);padding:8px 10px;user-select:all;word-break:break-all;flex:1 1 220px;font-size:13px}
.copymsg{font-size:13px;margin-top:6px;font-weight:600;min-height:1.2em}
.copymsg.ok{color:var(--sage-d)}.copymsg.ng{color:var(--err)}
.shbar{background:var(--sage);border-radius:var(--rm);padding:10px 14px;font-size:13px;margin-bottom:14px}
.note{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px}
.note.end{background:#eee;color:#555}.note.out{background:#fdecea;color:var(--err)}
.small12{font-size:12px;color:var(--sub);margin-top:14px}
#ov{position:fixed;background:rgba(58,51,49,.35);z-index:15;display:none;justify-content:flex-end;align-items:stretch}
#ov.on{display:flex}
#ov .dlg{background:var(--surf);border-radius:var(--rl) 0 0 var(--rl);width:min(380px,100%);height:100%;overflow:auto;padding:16px;box-shadow:-8px 0 28px rgba(0,0,0,.25);animation:slidein .25s ease-out}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){#ov .dlg{animation:none}}
#ov ul{list-style:none;margin:8px 0;padding:0;display:grid;gap:8px}
#ov li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--rm);padding:6px 10px}
#ov li .nm{flex:1 1 140px;font-size:13px}
.qty{display:flex;align-items:center;gap:4px}
.qin{width:3.4em;min-height:44px;text-align:center;border:1px solid var(--line);border-radius:var(--rm);font:inherit}
.qty button{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surf);border-radius:var(--rm)}
#list{border-top:3px dashed #d9c24a;background:#fffbe0;padding:14px 20px;font-size:13px;display:none}
body.show-note #list{display:block}
#list ol{margin:6px 0 0;padding-left:1.4em}
@container (max-width:480px){header.top,main{padding-left:12px;padding-right:12px}.sharebar{margin:16px -12px -20px;padding:10px 12px}.hbtn .t{font-size:11px}#list{padding:12px}.hero{padding:16px}}

/* 質感・動き */
body{background:var(--bg)}
.card,.detail,.filters,.chosen,.tile,.hero{box-shadow:var(--shadow)}
.card,.tile,.fb,.primary,.ghost,.heart{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.tile:hover,.fb:hover,.ghost:hover,.primary:not(:disabled):hover{transform:translateY(-1px)}
.card:active,.tile:active,.fb:active,.primary:active,.ghost:active{transform:scale(.98)}
.tile[aria-pressed=true]::before,.fb[aria-pressed=true]::before{content:"✓ "}
h2.sec{font-size:19px}
.hero h1{font-size:34px}
body.xmas h2.sec{position:relative;padding-bottom:8px}
body.xmas h2.sec::after{content:"";width:36px;height:3px;border-radius:2px;background:var(--gold);position:absolute;left:0;bottom:0}
.rib{fill:var(--coral)}.ribs{stroke:var(--coral)}
.orn{display:none}
body.xmas .orn{display:block;position:absolute;right:210px;top:0;width:110px;pointer-events:none}
body.xmas .hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 8% 24%,rgba(255,255,255,.7) 0 2px,transparent 3px),radial-gradient(circle at 22% 70%,rgba(255,255,255,.5) 0 1.5px,transparent 2.5px),radial-gradient(circle at 38% 18%,rgba(255,255,255,.6) 0 2px,transparent 3px),radial-gradient(circle at 55% 78%,rgba(255,255,255,.45) 0 1.5px,transparent 2.5px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.6) 0 2px,transparent 3px),radial-gradient(circle at 92% 62%,rgba(255,255,255,.5) 0 2px,transparent 3px)}
.hero>*{position:relative}
body.xmas .hero{border:2px solid rgba(201,162,39,.55)}
@container (max-width:600px){.hero h1{font-size:24px}.orn{display:none!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* #60 条件の欄の3群を同じボタンに（色はテーマ変数から。未選択=白地・枠・同じ余白、選択=主色＋白文字＋✓） */
.tiles,.bands,.cats{display:flex;flex-wrap:wrap;gap:8px;grid-template-columns:none}
.tile,.fb,.fb.txt,.cat{background:var(--surf);color:var(--ink);border:1px solid var(--bd2);border-radius:var(--rm);padding:8px 16px;font-size:14px;font-weight:400;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:none;cursor:pointer;line-height:1.3}
.tile .ic{font-size:18px}
.tile:hover,.fb:hover{background:var(--sel);border-color:var(--btn-sel)}
.tile:focus-visible,.fb:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
.tile[aria-pressed=true],.fb[aria-pressed=true],.fb.txt[aria-pressed=true]{background:var(--btn-sel);color:#fff;border:1px solid var(--btn-sel);font-weight:700;padding:8px 16px}
.tile[aria-pressed=true]:hover,.fb[aria-pressed=true]:hover{background:var(--btn-sel-d);border-color:var(--btn-sel-d)}
.tile[aria-pressed=true] .ic{filter:none}
.filters{gap:16px}.frow{gap:16px 28px}.fgrp{gap:8px}.fgrp b{font-size:14px}
h2.sec{margin:22px 0 10px}
.multi{font-size:12px;font-weight:400;color:var(--ink2);margin-left:6px}
@container (max-width:600px){.tiles,.bands,.cats{grid-template-columns:none}}

/* #60-2 スマホ幅：1行目＝ロゴ＋検索欄、2行目＝お気に入り・ログイン・カート（文言はそのまま、1行、44px以上） */
@container (max-width:480px){
 header.top{gap:4px 8px;padding-top:8px;padding-bottom:8px}
 header.top .logo{order:1;font-size:20px}
 header.top .hsearch{order:2;flex:1 1 0;min-width:0;max-width:none}
 header.top .spacer{order:3;flex:1 1 100%;height:0}
 header.top .hbtn{order:4;padding:4px 6px;gap:3px;min-width:44px;white-space:nowrap}
 header.top #bFav{margin-left:auto}
 header.top>.sp{order:5}
 .hbtn .tag{font-size:9px;padding:1px 4px}
}
</style>
</head>
<body class="show-sp show-note xmas">

<div id="bar" role="region" aria-label="レビュー用の操作（製品の画面ではありません）">
  <b>レビュー用操作</b>
  <div class="grp">画面：<button data-view="top" aria-pressed="true">トップ</button><button data-view="result" aria-pressed="false">検索結果</button><button data-view="share" aria-pressed="false">共有ページ</button></div>
  <div class="grp">幅：<button data-w="375" aria-pressed="false">375px</button><button data-w="1280" aria-pressed="true">1280px</button></div>
  <div class="grp">テーマ：<button data-theme="xmas" aria-pressed="true">クリスマス</button><button data-theme="light" aria-pressed="false">淡色</button></div>
  <div class="grp"><label><input type="checkbox" id="tSp" checked> 仕様ID</label><label><input type="checkbox" id="tNote" checked> 付箋</label></div>
  <div class="grp" id="stateBtns">検索の状態：
    <button data-st="initial">初期</button><button data-st="loading">検索中</button><button data-st="results">結果あり</button><button data-st="empty">0件</button><button data-st="error">失敗</button></div>
  <div class="grp">詳細の状態：<button data-ds="ok">表示</button><button data-ds="fail">通信失敗</button><button data-ds="nf">見つからない（404）</button></div>
  <div class="grp">デモ：<button data-demo="page">範囲外ページ</button><button data-demo="sold">カートに販売終了を入れる</button></div>
  <div class="grp"><label><input type="checkbox" id="fFail"> 次の検索・作成・共有表示を失敗させる</label><label><input type="checkbox" id="fSlow"> 11秒かかる（10秒で打ち切り）</label><label><input type="checkbox" id="fCopy"> コピーを失敗させる</label></div>
  <div class="grp" id="shareBtns" hidden>共有ページの状態：

function orderBy(c,useN){
  const rated=c.filter(p=>p.r!=null&&p.v!=null&&p.v>=1);
  const C=rated.length?rated.reduce((a,p)=>a+p.r,0)/rated.length:0;
  const sc=p=>{const v=(p.r==null||p.v==null)?0:p.v;const R=v===0?C:p.r;return (v/(v+20))*R+(20/(v+20))*C};
  const out=c.map(p=>({p,score:rated.length?sc(p):0}));
  out.sort((a,b)=>b.score-a.score||(useN?b.p.n-a.p.n:0)||a.p.id-b.p.id);
  return out.map(o=>o.p);
}
const catOk=(cats,p)=>!cats||!cats.length||cats.length>=CATS.length||cats.includes(p.cat);/* #58-1・2: 複数は OR。10個全部は選ばないのと同じ */
function rank(band,scene,cats){
  const bd=BANDS.find(x=>x[0]===band);
  const c=PRODUCTS.filter(p=>p.scenes.includes(scene)&&p.stock>=1&&(!bd||bd[2](p.price))&&catOk(cats,p));
  return orderBy(c,true).slice(0,10).map((p,i)=>({...p,rank:i+1,reason:reason(p)}));
}
const hasRating=p=>p.r!=null&&p.v!=null&&p.v>=1;
function reason(p){
  let s="",connect=false;

  else s+="職場の送別での購入は、まだありません。";
  if(hasRating(p)) s+=(connect?"評価も":"評価は")+p.r+"（"+p.v+"件）"+(hi?"と高めです。":"です。");
  if(p.d!=null) s+=p.wrap?p.d+"日で届き、ラッピングもできます。":p.d+"日で届きます。";
  else if(p.wrap) s+="ラッピングができます。";
  return s;
}

}

function request(ok){
  return new Promise((res,rej)=>{

    let done=false;
    const t=setTimeout(()=>{if(!done){done=true;rej(new Error("timeout"))}},10000);

  const fav=FAV.includes(p.id),hi=hasRating(p)&&p.r>=4.5;
  return `<aside class="detail ${S.detailOpen?"open":""}" aria-label="商品の詳細" id="detail">
   <h3>${esc(p.name)}</h3><button class="heart" data-fav="${p.id}" aria-pressed="${fav}" aria-label="お気に入り">${fav?"♥":"♡"}</button>
   ${imgHTML(p)}${hi?`<div class="topline"><span class="badge">高評価の商品</span></div>`:""}
   <div>${priceHTML(p.price)}</div>${metaHTML(p)}
   ${S.mode==="r01"&&p.reason?`<p class="reason">${esc(p.reason)}</p>`:""}
   <dl>${p.desc?`<dt>商品の特徴</dt><dd>${esc(p.desc)}</dd>`:""}${p.set?`<dt>セット内容</dt><dd>${esc(p.set)}</dd>`:""}</dl>
   <button class="primary full" data-cart="${p.id}">🛒 カートに入れる</button>
   <button class="ghost full" data-fav="${p.id}">♡ お気に入りに${fav?"から外す":"追加"}</button><div>${sp("AC-08")}</div></aside>`;
}
function resultHTML(){
  let h=`<section class="filters" aria-label="検索条件">
   <div class="frow">
    <div class="fgrp"><b>シーン${sp("OPEN-02")}</b><div class="fbtns" role="group" aria-label="シーン">${TILES.map(x=>`<button class="fb" data-fscene="${x}" aria-pressed="${S.scene===x}">${x}</button>`).join("")}</div></div>
    <div class="fgrp"><b>価格帯（税込）${sp("OPEN-03")}</b><div class="fbtns" role="group" aria-label="価格帯">${BANDS.map(b=>`<button class="fb" data-band="${b[0]}" aria-pressed="${S.band===b[0]}">${b[1]}</button>`).join("")}</div></div>
   </div>
   <div class="fgrp"><b>カテゴリー<span class="multi">（複数選べます）</span>${sp("AC-04")}</b><div class="fbtns">${CATS.map(c=>`<button class="fb txt" data-cat="${c}" aria-pressed="${S.cats.includes(c)}">${c}</button>`).join("")}</div></div>
  </section>  <div class="notice"><span>✓ 条件を選ぶと自動で検索されます${sp("AC-06")}</span><button id="clear">条件をクリア</button></div>`;
  if(S.st==="loading") return h+`<div class="msgbox empty" role="status">${spinnerHTML()}検索中…${sp("検索中 #39-2")}</div>`;
  if(S.st==="error") return h+`<div class="msgbox err" role="alert">失敗しました。もう一度お試しください<br><button class="ghost" id="retry" style="margin-top:8px">再試行</button>${sp("SP-01 失敗")}</div>`+afterResults();
  if(S.st==="empty"||(S.st==="results"&&!S.items.length)){
    const msg="この条件に合う商品がありません。"+(S.cats.length?"カテゴリー":S.band?"価格帯":"シーン")+"を変えてみてください";/* #56-4: カテゴリー→価格帯→シーンの順 */
    return h+`<div class="msgbox empty" role="status">${msg}${sp("SP-01 0件 #56-4")}</div>`+afterResults();
  }
  if(S.st!=="results") return h+`<div class="msgbox init">トップでシーンを押すか、上の条件を選んでください。</div>`+afterResults();
  const r01=S.mode==="r01";
  const total=S.items.length;
  if(S.page<1||S.page>Math.max(1,Math.ceil(total/PER))) S.page=1;
  const shown=r01?S.items:S.items.slice((S.page-1)*PER,S.page*PER);
  h+=`<div style="margin-top:14px"><b style="font-size:16px">${r01?`候補（${total}件）${sp("SP-02 上位10件")}`:"絞り込み結果"}</b>${r01?`<span style="font-size:12px;color:var(--sub);margin-left:8px">${S.scene?esc(S.scene):""}${S.band?"・"+BANDS.find(x=>x[0]===S.band)[1]+"（税込）":"・価格帯なし"}${S.cats.length?"・"+CATS.filter(c=>S.cats.includes(c)).map(esc).join("・")/* #59-1: タイルの並び順 */:""}</span>`:""}</div>
  <div class="layout"><div><div class="grid">${shown.map(p=>cardHTML(p)).join("")}</div>`;
  if(!r01){
    const pages=Math.max(1,Math.ceil(total/PER)),a=(S.page-1)*PER+1,b=Math.min(total,S.page*PER);
    h+=`<nav class="pager" aria-label="ページ送り"><span>全 ${total} 件中 ${a} 〜 ${b} 件を表示${sp("#45-5 12件ずつ")}</span><span class="pg"><button data-pg="${S.page-1}" ${S.page<=1?"disabled":""} aria-label="前へ">‹</button>${Array.from({length:pages},(_,i)=>`<button data-pg="${i+1}" ${S.page===i+1?'aria-current="page"':""}>${i+1}</button>`).join("")}<button data-pg="${S.page+1}" ${S.page>=pages?"disabled":""} aria-label="次へ">›</button></span></nav>`;
  }
  h+=`</div>${detailHTML()}</div>`;
  return h+afterResults();
}
function afterResults(){ return (S.picked.size||S.creating||S.link||S.st==="results")?chosenHTML()+sharebar():"" }
function chosenHTML(){
  const a=[...S.picked.values()];
  return `<section class="chosen" aria-label="選んだ候補"><b>選んだ候補（${a.length}件）</b>${sp("SP-04 #39-3")}
   ${a.length?`<ul>${a.map(p=>`<li><span class="nm">${esc(p.name)}</span><span>${priceHTML(p.price)}</span><button class="ghost" data-unpick="${p.id}" aria-label="${esc(p.name)}を外す">外す</button></li>`).join("")}</ul>`:`<div style="font-size:13px;color:var(--sub);margin-top:6px">まだ選んでいません。</div>`}</section>`;
}
function sharebar(){
  const n=S.picked.size, over=n>10, dis=n===0||over||S.creating;
  let h=`<div class="sharebar">${over?`<div class="overmsg" role="alert">共有リンクに入れられるのは10件までです。選ぶ数を減らしてください${sp("#36 N-06")}</div>`:""}
   <button class="primary" id="mk" ${dis?"disabled":""}>${S.creating?"作成中…":"共有リンクを作る"}</button>${sp("SP-05")}
   <span style="font-size:13px" role="status" aria-live="polite">選択中：${n}件</span>${n===0&&!S.creating?`<span style="font-size:12px;color:var(--sub)">1つ以上選ぶと作れます</span>`:""}`;
  if(S.mkErr) h+=`<div class="msgbox err" style="flex-basis:100%;margin:0" role="alert">失敗しました。もう一度お試しください <button class="ghost" id="mk2">再試行</button>${sp("SP-05 失敗")}</div>`;
  if(S.link) h+=`<div class="linkbox"><div class="linkrow"><code id="lk">${esc(S.link)}</code><button class="primary" id="cp">コピー</button>${sp("SP-05 #32-6・#33")}</div>
   <div class="copymsg ${S.copyMsg?S.copyMsg.k:""}" role="status" aria-live="polite">${S.copyMsg?esc(S.copyMsg.t):""}</div>
   <button class="ghost" id="openMine">この共有リンクを開いてみる</button>${note(0)}</div>`;
  return h+"</div>";
}
function shareHTML(){
  let h=`<h1>共有された贈りもの候補${sp("SP-06")}</h1>`;
  const st=S.shState;
  if(st==="load") return h+`<div class="msgbox empty" role="status">${spinnerHTML()}読み込み中…${sp("読み込み中")}</div>`;
  if(st==="fail") return h+`<div class="msgbox err" role="alert">失敗しました。もう一度お試しください<br><button class="ghost" id="shRetry" style="margin-top:8px">再試行</button>${sp("SP-06 失敗")}</div>`;
  if(st==="nf") return h+`<div class="msgbox empty" role="status">リンクが見つかりません${sp("SP-06")}</div>`;
  if(st==="exp") return h+`<div class="msgbox empty" role="status">このリンクは期限切れです<br><span style="font-size:13px">作った人に、新しいリンクを頼んでください</span>${sp("SP-06 #37-3")}</div>`;
  const items=S.shItems||[];
  return h+`<div class="shbar">作成時点の商品名・価格です。${sp("SP-06 #37")}</div>
   <div class="grid">${items.map(it=>{
     const cur=PRODUCTS.find(p=>p.id===it.id);
     const nt=!cur?`<span class="note end">この商品は販売終了しました</span>${sp("SP-06 #32-5")}`:cur.stock===0?`<span class="note out">在庫なし</span>${sp("SP-06 #32-5")}`:"";
     return `<article class="card">${imgHTML(cur||{cat:"生活雑貨"})}<div style="font-weight:700">${esc(it.name)}</div>${priceHTML(it.price)}${nt?`<div>${nt}</div>`:""}<p class="reason">${esc(it.reason)}${sp("SP-03")}</p></article>`}).join("")}</div>
   <p class="small12">このページはリンクを知っている人なら誰でも見られます${sp("N-15")}</p>`;
}
function renderOv(){
  const ov=$("#ov");
  if(!S.panel){ov.className="";ov.innerHTML="";return}
  ov.className="on";{const r=$("#app").getBoundingClientRect();ov.style.cssText=`left:${r.left}px;width:${r.width}px;top:${$("#bar").offsetHeight}px;bottom:0`}
  if(S.panel==="fav"){
    ov.innerHTML=`<div class="dlg"><b>お気に入り（${FAV.length}件）</b>${sp("FAV #46-6")}<ul>${FAV.map(id=>{const p=PRODUCTS.find(x=>x.id===id);return p?`<li><span class="nm">${esc(p.name)}</span><span>${priceHTML(p.price)}</span><button class="ghost" data-fav="${id}">外す</button></li>`:""}).join("")||'<li style="color:var(--sub)">まだありません。</li>'}</ul><button class="ghost full" data-close>閉じる</button></div>`;
  }else{
    const ids=Object.keys(CART).map(Number);let total=0;
    ov.innerHTML=`<div class="dlg"><b>カート</b>${sp("OPEN-05 #46-6")}<ul>${ids.map(id=>{const p=PRODUCTS.find(x=>x.id===id);if(!p)return `<li><span class="nm">（販売終了の商品）<br><span class="note end">販売終了</span>${sp("#46-6 合計に入れない")}</span><button class="ghost" data-qx="${id}">削除</button></li>`;if(p.stock===0)return `<li><span class="nm">${esc(p.name)}<br>${priceHTML(p.price)} <span class="note out">在庫なし</span>${sp("#50-2 合計に入れない")}</span><button class="ghost" data-qx="${id}">削除</button></li>`;total+=p.price*CART[id];return `<li><span class="nm">${esc(p.name)}<br>${priceHTML(p.price)}</span><span class="qty"><button data-qd="${id}" aria-label="減らす" ${CART[id]<=1?"disabled":""}>−</button><input class="qin" data-qin="${id}" type="text" inputmode="numeric" value="${CART[id]}" aria-label="数量（1〜99）"><button data-qu="${id}" aria-label="増やす" ${CART[id]>=99?"disabled":""}>＋</button></span><button class="ghost" data-qx="${id}">削除</button></li>`}).join("")||'<li style="color:var(--sub)">カートは空です。</li>'}</ul>
     <div style="font-weight:700;margin:8px 0">合計 ${yen(total)}${TAX}</div><button class="primary full" data-order>注文へ進む</button><button class="ghost full" data-close style="margin-top:8px">閉じる</button></div>`;
  }
}
/* ---------- 操作 ---------- */
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2000)}
function setFav(id){const i=FAV.indexOf(id);i<0?FAV.push(id):FAV.splice(i,1);saveFav()}
function bind(){
  document.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{const t=b.dataset.tile;if(S.scene===t){S.scene=null;render();return}S.scene=t;S.page=1;S.view="result";runSearch()});
  document.querySelectorAll("[data-tband]").forEach(b=>b.onclick=()=>{S.band=S.band===b.dataset.tband?null:b.dataset.tband;if(S.scene){S.page=1;S.view="result";runSearch()}else render()});
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{const c=b.dataset.cat;if(b.classList.contains("fb")){/* 結果画面：押すたびに選ぶ・外す（#58-5） */S.cats=S.cats.includes(c)?S.cats.filter(x=>x!==c):[...S.cats,c]}else{/* トップ：そのカテゴリー1つを選んで検索結果へ（#58-4） */S.cats=(S.cats.length===1&&S.cats[0]===c)?[]:[c]}S.page=1;S.view="result";runSearch()});
  document.querySelectorAll("[data-fscene]").forEach(b=>b.onclick=()=>{S.scene=S.scene===b.dataset.fscene?null:b.dataset.fscene;S.page=1;runSearch()});
  document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>{S.mode="r02";S.scene=null;S.band=null;S.cats=[];S.page=1;S.items=filterR02();S.st="results";S.detailId=+b.dataset.rec;S.detailOpen=true;S.view="result";render()});
  document.querySelectorAll("[data-band]").forEach(b=>b.onclick=()=>{S.band=S.band===b.dataset.band?null:b.dataset.band;S.page=1;runSearch()});
  const bg=$("#bandGo"); if(bg) bg.onclick=()=>{S.scene=null;S.page=1;S.view="result";runSearch()};
  const cl=$("#clear"); if(cl) cl.onclick=()=>{S.scene=null;S.band=null;S.cats=[];S.page=1;runSearch()};
  document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{S.page=+b.dataset.pg;render()});
  document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>{S.detailId=+b.dataset.detail;S.dstate="ok";S.detailOpen=true;render();const d=$("#detail");if(d&&innerWidth<1100)d.scrollIntoView({block:"nearest"})});
  document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{setFav(+b.dataset.fav);render()});
  document.querySelectorAll("[data-cart]").forEach(b=>b.onclick=()=>{const id=b.dataset.cart;CART[id]=Math.min(99,(CART[id]||0)+1);saveCart();render();toast("カートに入れました")});
  document.querySelectorAll("[data-pick]").forEach(c=>c.onchange=()=>{const id=+c.dataset.pick;if(c.checked){const p=S.items.find(x=>x.id===id)||PRODUCTS.find(x=>x.id===id);if(p)S.picked.set(id,{...p,reason:reason(p)})}else S.picked.delete(id);render();const e=document.querySelector('[data-pick="'+id+'"]');if(e)e.focus()});
  document.querySelectorAll("[data-unpick]").forEach(c=>c.onclick=()=>{S.picked.delete(+c.dataset.unpick);render()});
  const dr=$("#dRetry"); if(dr) dr.onclick=()=>{S.dstate="load";const tk=++S.token;render();request(()=>1).then(()=>{if(tk!==S.token)return;S.dstate="ok";render()}).catch(()=>{if(tk!==S.token)return;S.dstate="fail";render()})};
  const r=$("#retry"); if(r) r.onclick=runSearch;
  const m=$("#mk"); if(m) m.onclick=doCreate; const m2=$("#mk2"); if(m2) m2.onclick=doCreate;
  const cp=$("#cp"); if(cp) cp.onclick=doCopy;
  const om=$("#openMine"); if(om) om.onclick=()=>openShare(S.shId);
  const sr=$("#shRetry"); if(sr) sr.onclick=()=>openShare(S.shId);
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{S.panel=null;render()});
  document.querySelectorAll("[data-qu]").forEach(b=>b.onclick=()=>{CART[b.dataset.qu]=Math.min(99,CART[b.dataset.qu]+1);saveCart();render()});
  document.querySelectorAll("[data-qd]").forEach(b=>b.onclick=()=>{const k=b.dataset.qd;CART[k]=Math.max(1,CART[k]-1);saveCart();render()});
  document.querySelectorAll("[data-qin]").forEach(i=>i.onchange=()=>{const k=i.dataset.qin;const t=String(i.value).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[－ー−]/g,"-").trim();/* #53-4: 整数だけ受ける。空・小数・数字以外は直前の数量。0以下は1 */if(/^-?\d+$/.test(t))CART[k]=Math.min(99,Math.max(1,parseInt(t,10)));saveCart();render()});
  document.querySelectorAll("[data-qx]").forEach(b=>b.onclick=()=>{delete CART[b.dataset.qx];saveCart();render()});
  const od=document.querySelector("[data-order]"); if(od) od.onclick=()=>toast("デモのため、注文はできません");
}
function runSearch(){
  S.dstate="ok";
  S.mode=S.scene?"r01":"r02";
  const tk=++S.token; S.st="loading";render();
  request(()=>S.mode==="r01"?rank(S.band,tag(S.scene),S.cats):filterR02())
   .then(items=>{ if(tk!==S.token)return; S.items=items;S.st=items.length?"results":"empty";S.detailId=items[0]?items[0].id:null;S.detailOpen=false;render() })
   .catch(()=>{ if(tk!==S.token)return; S.st="error";render() });
}
function doCreate(){
  if(S.picked.size===0||S.picked.size>10||S.creating)return;
  S.creating=true;S.mkErr=false;S.copyMsg=null;render();
  const ids=[...S.picked.keys()];const tk=++S.token;
  request(()=>{const id=rid();store[id]={created:Date.now(),items:snap(ids)};return id})
   .then(id=>{if(tk!==S.token)return;S.creating=false;S.shId=id;S.link="https://giftia.example/s/"+id;render()})
   .catch(()=>{if(tk!==S.token)return;S.creating=false;S.mkErr=true;render()});
}
async function doCopy(){
  clearTimeout(doCopy.t);
  try{
    if($("#fCopy").checked) throw new Error("denied");
    await navigator.clipboard.writeText(S.link);
    S.copyMsg={k:"ok",t:"コピーしました"};render();
    doCopy.t=setTimeout(()=>{S.copyMsg=null;render()},2000);
  }catch(e){ S.copyMsg={k:"ng",t:"コピーできませんでした。リンクを長押ししてコピーしてください"};render() }
}
function openShare(id){
  S.view="share";S.shId=id;S.shState="load";render();
  const tk=++S.token;
  request(()=>{const r=store[id]; if(!r) return {s:"nf"}; if(Date.now()-r.created>720*HOUR) return {s:"exp"}; return {s:"ok",items:r.items}})
   .then(r=>{if(tk!==S.token)return;S.shState=r.s;S.shItems=r.items||null;render()})
   .catch(()=>{if(tk!==S.token)return;S.shState="fail";render()});
}
/* ヘッダー・レビューバー */
$("#bFav").onclick=()=>{S.panel=S.panel==="fav"?null:"fav";render()};
$("#bCart").onclick=()=>{S.panel=S.panel==="cart"?null:"cart";render()};
$("#bLogin").onclick=()=>toast("準備中です（運営の承認後に作ります）");
$("#ov").onclick=e=>{if(e.target.id==="ov"){S.panel=null;render()}};
$("#home").onclick=()=>{S.view="top";S.panel=null;render()};
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  S.view=b.dataset.view;
  if(S.view==="share"&&!S.shItems&&S.shState==="ok"){openShare(SHID.ok)}
  else if(S.view==="result"&&S.st==="initial"&&!S.items.length){S.scene=S.scene||"送別";S.mode="r01";S.items=rank(null,"送別");S.st="results";S.detailId=S.items[0].id;render()}
  else render()});
document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-w]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#app").classList.toggle("w375",b.dataset.w==="375")});
$("#tSp").onchange=e=>document.body.classList.toggle("show-sp",e.target.checked);
$("#tNote").onchange=e=>document.body.classList.toggle("show-note",e.target.checked);
document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
  S.token++; const st=b.dataset.st; S.st=st; S.creating=false;
  S.view=st==="initial"?"top":"result";
  if(st==="results"&&!S.items.length){S.scene=S.scene||"送別";S.mode="r01";S.items=rank(S.band,tag(S.scene));S.detailId=S.items[0].id}
  render()});
document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{
  if(b.dataset.demo==="page"){S.view="result";S.mode="r02";S.scene=null;S.band=null;S.items=filterR02();S.st="results";S.detailId=S.items[0].id;S.page=99;render()}
  else{CART[999]=1;CART[7]=1;saveCart();S.panel="cart";render()}});
document.querySelectorAll("[data-ds]").forEach(b=>b.onclick=()=>{
  S.token++;
  if(!(S.view==="result"&&S.items.length)){S.view="result";S.scene=S.scene||"送別";S.mode="r01";S.items=rank(S.band,tag(S.scene),S.cats);S.st="results"}
  if(!S.items.some(x=>x.id===S.detailId)) S.detailId=S.items[0].id;
  S.dstate=b.dataset.ds;S.detailOpen=true;render();const d=$("#detail");if(d&&innerWidth<1100)d.scrollIntoView({block:"nearest"})});
document.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.sh; S.token++;
  if(k==="load"){S.shState="load";render()}
  else if(k==="fail"){S.shState="fail";S.shId=S.shId||SHID.ok;render()}
  else if(k==="mine"){openShare(S.shId)}
  else openShare(SHID[k]);
});
document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{document.body.classList.toggle("xmas",b.dataset.theme==="xmas");document.querySelectorAll("[data-theme]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
function setBarH(){document.documentElement.style.setProperty("--barh",$("#bar").offsetHeight+"px");renderOv()}
addEventListener("resize",setBarH);
render();setBarH();
</script>
</body>
</html>

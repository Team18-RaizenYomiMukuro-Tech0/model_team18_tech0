<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giftia レビュー用モック</title>
<style>
:root{--bg:#f4f1ee;--paper:#fff;--ink:#3a3331;--sub:#7a6f6a;--line:#e8dfd9;--peach:#fdeee6;--coral:#ee6c4d;--coral-d:#d4553a;--sage:#e6ebdd;--sage-d:#5d7a4e;--err:#b3261e;--errbg:#fdecea;--note:#fff3a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
#bar{position:sticky;top:0;z-index:20;background:#2f2a28;color:#fff;padding:8px 12px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
#bar b{color:#ffd9cc}
#bar .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#bar button{background:#4a4340;border:1px solid #6b625e;color:#fff;border-radius:6px;padding:3px 9px;font-size:12px}
#bar button[aria-pressed=true]{background:var(--coral);border-color:var(--coral)}
#bar label{display:flex;gap:4px;align-items:center}
#stage{padding:14px 8px 40px;display:flex;justify-content:center}
#app{container-type:inline-size;width:100%;max-width:1280px;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;min-height:70vh}
#app.w375{max-width:375px}
.sp{display:none;font:600 10px/1 monospace;background:#e3efff;color:#1a4fa0;border:1px solid #9bbcf0;border-radius:4px;padding:2px 4px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.show-sp .sp{display:inline-block}
.sticky{display:none;background:var(--note);color:#4a3d00;border:1px solid #d9c24a;border-radius:4px;padding:5px 8px;font-size:12px;line-height:1.45;margin:6px 0;box-shadow:1px 2px 0 rgba(0,0,0,.12);max-width:34em;text-align:left}
.sticky::before{content:"📌 仕様に書かれていません：";font-weight:700}
body.show-note .sticky{display:block}
header.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;color:var(--ink);letter-spacing:.02em;display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0}
.logo i{display:inline-block;width:22px;height:22px;border:2px solid var(--coral);border-radius:4px;position:relative}
.logo i::after{content:"";position:absolute;left:8px;top:-2px;width:2px;height:22px;background:var(--coral)}
.spacer{flex:1}
.hsearch{display:flex;flex:1 1 180px;max-width:360px;border:1px solid #bdb0a8;border-radius:8px;overflow:hidden}
.hsearch input{flex:1;min-width:0;border:0;padding:8px 10px;font:inherit;min-height:44px;background:#f5f2ef}
.hsearch input::placeholder{color:#b5aaa4}
.hsearch{background:#f5f2ef}
.selbadge{align-self:flex-start;background:var(--coral);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px}
.hsearch button{border:0;background:var(--peach);min-width:44px;min-height:44px}
.tax{font-size:12px;font-weight:400;color:var(--sub)}
.small12{font-size:12px;color:var(--sub);margin-top:14px}
.chosen{margin-top:18px;border:2px solid var(--coral);border-radius:12px;padding:12px;background:#fffaf8}
.chosen ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.chosen li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.chosen li .nm{flex:1 1 160px}
.overmsg{flex-basis:100%;color:var(--err);font-weight:600;font-size:13px}
.hbtn{background:none;border:0;padding:6px 8px;border-radius:8px;display:flex;gap:4px;align-items:center;font-size:13px;min-height:44px}
.hbtn:hover{background:var(--peach)}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;background:#eee;color:#555}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:#3a3331;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:10;display:none;max-width:90%}
.toast.on{display:block}
main{padding:20px}
h1{font-size:20px;margin:0 0 4px}
.hero{background:var(--peach);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.hero p{margin:0;color:var(--sub);font-size:13px}
form.search{background:var(--peach);border-radius:12px;padding:16px 20px;display:grid;gap:14px}
fieldset{border:0;margin:0;padding:0}
legend,label.lb{font-weight:700;font-size:13px;margin-bottom:6px;padding:0;display:block}
.scenes{display:flex;gap:8px;flex-wrap:wrap}
.scene{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 20px;min-height:44px}
.scene[aria-pressed=true]{border:2px solid var(--coral);background:#fff6f2;font-weight:700;padding:8px 19px}
.budget{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.yen{font:inherit;padding:9px 12px;border:1px solid #bdb0a8;border-radius:8px;width:11em;min-height:44px;background:#fff}
input.yen[aria-invalid=true]{border:2px solid var(--err)}
.ferr{color:var(--err);font-size:13px;margin-top:4px;font-weight:600;min-height:1.2em}
.primary{background:var(--coral);color:#fff;border:0;border-radius:8px;padding:10px 22px;font-weight:700;min-height:44px}
.primary:not(:disabled):hover{background:var(--coral-d)}
.ghost{background:#fff;border:1px solid #bdb0a8;border-radius:8px;padding:8px 14px;min-height:44px}
.msgbox{margin-top:16px;border-radius:10px;padding:18px;text-align:center}
.msgbox.err{background:var(--errbg);color:var(--err)}
.msgbox.empty{background:#f5f2ef;color:var(--sub)}
.msgbox.init{background:var(--sage);color:var(--sage-d)}
.spinner{width:28px;height:28px;border:4px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@container (min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@container (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fff;position:relative}
.card.sel{border:2px solid var(--coral);padding:11px;background:#fffaf8}
.rank{align-self:flex-start;background:#3a3331;color:#fff;font-size:11px;border-radius:10px;padding:1px 8px}
.badge{align-self:flex-start;background:#fbe3d9;color:#a2402a;font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px}
.img{height:90px;border-radius:8px;background:linear-gradient(#f6f3ee 33%,#d5dcc9 33% 66%,#f4a58f 66%)}
.name{font-weight:700}
.price{font-size:18px;font-weight:700}
.reason{font-size:13px;color:#4d4441;margin:0}
.pick{margin-top:auto;display:flex;gap:8px;align-items:center;font-weight:600;min-height:44px;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.pick input{width:20px;height:20px;accent-color:var(--coral)}
.sharebar{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--peach);padding:12px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px -20px -20px}
.linkbox{flex-basis:100%;background:var(--sage);border-radius:10px;padding:12px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkrow code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;user-select:all;word-break:break-all;flex:1 1 220px;font-size:13px}
.copymsg{font-size:13px;margin-top:6px;font-weight:600;min-height:1.2em}
.copymsg.ok{color:var(--sage-d)}.copymsg.ng{color:var(--err)}
.shbar{background:var(--sage);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.note{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px}
.note.end{background:#eee;color:#555}.note.out{background:#fdecea;color:var(--err)}
#list{border-top:3px dashed #d9c24a;background:#fffbe0;padding:14px 20px;font-size:13px;display:none}
body.show-note #list{display:block}
#list ol{margin:6px 0 0;padding-left:1.4em}
@container (max-width:480px){header.top,main{padding-left:12px;padding-right:12px}.sharebar{margin:16px -12px -20px;padding:10px 12px}.hbtn .t{font-size:11px}#list{padding:12px}}
</style>
</head>
<body class="show-sp show-note">

<div id="bar" role="region" aria-label="レビュー用の操作（製品の画面ではありません）">
  <b>レビュー用操作</b>
  <div class="grp">画面：<button data-view="search" aria-pressed="true">検索</button><button data-view="share" aria-pressed="false">共有ページ</button></div>
  <div class="grp">幅：<button data-w="375" aria-pressed="false">375px</button><button data-w="1280" aria-pressed="true">1280px</button></div>
  <div class="grp"><label><input type="checkbox" id="tSp" checked> 仕様ID</label><label><input type="checkbox" id="tNote" checked> 付箋</label></div>
  <div class="grp" id="stateBtns">検索の状態：
    <button data-st="initial">初期</button><button data-st="loading">検索中</button><button data-st="results">結果あり</button><button data-st="empty">0件</button><button data-st="error">失敗</button><button data-st="invalid">入力エラー</button></div>
  <div class="grp"><label><input type="checkbox" id="fFail"> 次の検索・作成・共有表示を失敗させる</label><label><input type="checkbox" id="fSlow"> 11秒かかる（10秒で打ち切り）</label><label><input type="checkbox" id="fCopy"> コピーを失敗させる</label></div>
  <div class="grp" id="shareBtns" hidden>共有ページの状態：
    <button data-sh="ok">表示</button><button data-sh="gone">販売終了・在庫なし</button><button data-sh="exp">期限切れ</button><button data-sh="nf">見つからない</button><button data-sh="load">読み込み中</button><button data-sh="fail">失敗</button><button data-sh="mine" id="shMine" disabled>作ったリンクを開く</button></div>
</div>

<div id="stage"><div id="app">
  <header class="top">
    <button class="logo" id="home" aria-label="Giftia 検索ページへ"><i></i>Giftia</button>
    <span class="sp">AC-03</span>
    <div class="hsearch"><input type="text" id="hq" aria-label="商品名で探す（準備中）" placeholder="準備中" disabled></div><span class="sp">#41-8</span>
    <span class="spacer"></span>
    <button class="hbtn" data-soon="fav">♡ <span class="t">お気に入り</span></button>
    <button class="hbtn" data-soon="login">👤 <span class="t">ログイン</span><span class="tag">準備中</span></button>
    <button class="hbtn" data-soon="cart">🛒 <span class="t">カート</span></button>
  </header>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <main id="view"></main>
  <div id="list"></div>
</div></div>

<script>
"use strict";
/* 架空データ（実在の商品ではありません） */
const PRODUCTS=[
 {id:1, name:"綿の店 ふわり ガーゼタオルセット", price:4000,stock:12,scenes:["お礼","誕生日","送別"],r:4.7, v:120,n:48,d:3,wrap:true},
 {id:2, name:"Kasuri Home ガーゼタオルセット",   price:4300,stock:5, scenes:["送別","お礼"],        r:4.6, v:31, n:12,d:2,wrap:true},
 {id:3, name:"Lino タオルセット",                price:3600,stock:4, scenes:["送別"],              r:4.3, v:46, n:0, d:2,wrap:false},
 {id:4, name:"ソフトガーゼ タオルセット",        price:3200,stock:8, scenes:["誕生日","送別"],     r:4.5, v:22, n:7, d:3,wrap:true},
 {id:5, name:"ナチュラルタッチ タオルセット",    price:3800,stock:3, scenes:["送別","お礼"],       r:4.49,v:35, n:5, d:3,wrap:true},
 {id:6, name:"山の香 ほうじ茶ギフト",            price:4100,stock:20,scenes:["お礼","送別"],       r:4.8, v:18, n:30,d:null,wrap:false},
 {id:7, name:"季節の焼き菓子詰合せ",             price:4400,stock:0, scenes:["送別","誕生日"],     r:4.4, v:200,n:20,d:2,wrap:true},
 {id:8, name:"プリザーブドフラワー ミニ",        price:4500,stock:6, scenes:["誕生日","送別"],     r:null,v:null,n:0,d:4,wrap:true},
 {id:9, name:"ふんわり綿 フェイスタオル",            price:5200,stock:10,scenes:["お礼","送別"],       r:4.4, v:60, n:15,d:2,wrap:true},
 {id:10,name:"手ぬぐい 季節柄",                  price:2800,stock:30,scenes:["送別","お礼"],       r:4.1, v:9,  n:2, d:2,wrap:false},
 {id:11,name:"ドリップコーヒー 12袋",            price:3300,stock:15,scenes:["お礼","送別"],       r:4.2, v:0,  n:3, d:2,wrap:false},
 {id:12,name:"入浴剤 ギフトボックス",            price:3150,stock:9, scenes:["送別","誕生日"],     r:4.6, v:55, n:0, d:null,wrap:true}
];
const yen=n=>n.toLocaleString("ja-JP")+"円";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 付箋：まだ決まっていない点だけ残す */
const NOTES=[
 /*0*/"共有リンクの URL の頭（ドメイン）は、外部公開の承認後に決めます（#37-16）。いまは仮の https://giftia.example/s/ です。"
];
const note=i=>`<div class="sticky">${esc(NOTES[i])}</div>`;
const sp=t=>`<span class="sp">${t}</span>`;
const TAX='<span class="tax">（税込）</span>';

/* 検索中の回る表示。「あかぷさんの顔」の画像が届いたら、ここ1か所だけ差し替える（#39-2） */
const spinnerHTML=()=>`<img class="spinner" src="akapu.png" alt="" width="96" height="96" style="display:block;border:0;border-radius:50%;width:96px;height:96px;object-fit:cover">`;

/* SP-01 予算の正規化・検証（設計「予算欄の正規化」）。空欄は予算なし（#38・#39-4'）。戻り値: 数 / null=予算なし / NaN=入力エラー */
function parseBudget(raw){
  let s=String(raw).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/，/g,",");
  s=s.replace(/^[\s　]+|[\s　]+$/g,"").replace(/,/g,"");
  if(s==="") return null;
  if(!/^[0-9]+$/.test(s)) return NaN;
  const n=parseInt(s.replace(/^0+(?=\d)/,""),10);
  return (n>=1000&&n<=999999)?n:NaN;
}
/* SP-01 絞り込み / SP-02 ベイズ平均 / SP-03 理由 */
function rank(budget,scene){
  const c=PRODUCTS.filter(p=>p.scenes.includes(scene)&&p.stock>=1&&(budget===null||(p.price*10>=budget*7&&p.price<=budget)));
  const rated=c.filter(p=>p.r!=null&&p.v!=null&&p.v>=1);
  const C=rated.length?rated.reduce((a,p)=>a+p.r,0)/rated.length:0;
  const sc=p=>{const v=(p.r==null||p.v==null)?0:p.v;const R=v===0?C:p.r;return (v/(v+20))*R+(20/(v+20))*C};
  const out=c.map(p=>({p,score:rated.length?sc(p):0}));
  out.sort((a,b)=>b.score-a.score||b.p.n-a.p.n||a.p.id-b.p.id);
  return out.slice(0,10).map((o,i)=>({...o.p,rank:i+1,reason:reason(o.p)}));
}
const hasRating=p=>p.r!=null&&p.v!=null&&p.v>=1;
function reason(p){
  let s="",connect=false;
  const hi=hasRating(p)&&p.r>=4.5;
  if(p.n>=1){ if(hi){s+="職場の送別で"+p.n+"回選ばれていて、";connect=true}else s+="職場の送別で"+p.n+"回選ばれています。"}
  else s+="職場の送別での購入は、まだありません。";
  if(hasRating(p)) s+=(connect?"評価も":"評価は")+p.r+"（"+p.v+"件）"+(hi?"と高めです。":"です。");
  if(p.d!=null) s+=p.wrap?p.d+"日で届き、ラッピングもできます。":p.d+"日で届きます。";
  else if(p.wrap) s+="ラッピングができます。";
  return s;
}
/* 状態。picked は選んだ順の Map（検索し直しても残す。#39-3） */
const S={view:"search",st:"initial",scene:null,budgetRaw:"4500",sceneErr:false,items:[],picked:new Map(),creating:false,mkErr:false,link:null,copyMsg:null,token:0,shState:"ok",shId:null,shItems:null};
const store={};
const HOUR=3600e3;
const rid=()=>{const a="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";const b=new Uint8Array(22);crypto.getRandomValues(b);return [...b].map(x=>a[x%64]).join("")};
const snap=ids=>ids.map(id=>{const p=PRODUCTS.find(x=>x.id===id);return p?{id:p.id,name:p.name,price:p.price,reason:reason(p)}:{id,name:"（今は無い商品）",price:2500,reason:"職場の送別での購入は、まだありません。2日で届きます。"}});
const SHID={ok:"demoOK0000000000000000",gone:"demoGone00000000000000",exp:"demoExpired0000000000_",nf:"notExist0000000000000_"};
store[SHID.ok]={created:Date.now()-5*HOUR,items:snap([1,2,6])};
store[SHID.gone]={created:Date.now()-30*HOUR,items:snap([1,7,999])};
store[SHID.exp]={created:Date.now()-(720*HOUR+1000),items:snap([1,2])};

/* 擬似リクエスト：10秒で打ち切り、後から届いた応答は捨てる */
function request(ok){
  return new Promise((res,rej)=>{
    const slow=$("#fSlow").checked,fail=$("#fFail").checked;
    let done=false;
    const t=setTimeout(()=>{if(!done){done=true;rej(new Error("timeout"))}},10000);
    setTimeout(()=>{ if(done)return; done=true;clearTimeout(t); fail?rej(new Error("500")):res(ok()) }, slow?11000:700);
  });
}

/* 描画 */
function render(){
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===S.view));
  $("#stateBtns").hidden=S.view!=="search"; $("#shareBtns").hidden=S.view!=="share";
  document.querySelectorAll("[data-st]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.st===S.st));
  document.querySelectorAll("[data-sh]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sh===S.shState));
  $("#shMine").disabled=!S.link;
  $("#view").innerHTML=S.view==="search"?searchHTML():shareHTML();
  bind();
  $("#list").innerHTML="<b>📌 まだ決まっていない点（"+NOTES.length+"件）</b><ol>"+NOTES.map(n=>"<li>"+esc(n)+"</li>").join("")+"</ol>";
}
function searchHTML(){
  const sc=["お礼","誕生日","送別"];
  const bv=parseBudget(S.budgetRaw), badBudget=S.st==="invalid"&&Number.isNaN(bv);
  let h=`<div class="hero"><h1>ありがとうに、ちょうどいいギフト。</h1><p>予算（総額）とシーンから、贈りものの候補を出します。${sp("SP-01")}</p></div>
  <form class="search" id="f" novalidate>
   <fieldset><legend>シーン${sp("SP-01")}</legend><div class="scenes" role="group" aria-label="シーン">${sc.map(x=>`<button type="button" class="scene" data-scene="${x}" aria-pressed="${S.scene===x}">${x}</button>`).join("")}</div>
    <div class="ferr" role="alert">${S.sceneErr?"シーンを選んでください":""}</div></fieldset>
   <div><label class="lb" for="bud">予算（任意）${sp("SP-01")}</label>
    <div class="budget"><input class="yen" id="bud" inputmode="numeric" autocomplete="off" placeholder="例：4,500" value="${esc(S.budgetRaw)}" aria-invalid="${badBudget}" aria-describedby="berr"> 円
    <button class="primary" type="submit" ${S.st==="loading"?"disabled":""}>候補を出す</button></div>
    <div id="berr" class="ferr" role="alert">${badBudget?"予算は1,000〜999,999円の整数で入れてください":""}</div>
    <div style="font-size:12px;color:var(--sub)">空でも探せます（価格では絞りません）。1,000〜999,999円の整数。全角やカンマも読めます。</div></div>
  </form>`;
  if(S.st==="initial") h+=`<div class="msgbox init">シーンを選んで「候補を出す」を押してください。予算は空でも大丈夫です。</div>`;
  if(S.st==="loading") h+=`<div class="msgbox empty" role="status">${spinnerHTML()}検索中…${sp("検索中 #39-2")}</div>`;
  if(S.st==="empty") h+=`<div class="msgbox empty" role="status">${parseBudget(S.budgetRaw)===null?"この条件に合う商品がありません。シーンを変えてみてください":"条件に合う商品がありません。予算を変えてみてください"}${sp("SP-01 0件 #41-2")}</div>`;
  if(S.st==="error") h+=`<div class="msgbox err" role="alert">失敗しました。もう一度お試しください<br><button class="ghost" id="retry" style="margin-top:8px">再試行</button>${sp("SP-01 失敗")}</div>`;
  if(S.st==="results"){
    h+=`<div class="rhead"><h2 style="margin:0;font-size:16px">候補（${S.items.length}件）</h2>${sp("SP-02 上位10件")}</div>
    <div class="grid">${S.items.map(card).join("")}</div>`;
  }
  if(S.picked.size||S.creating||S.link||S.st==="results") h+=chosenHTML()+sharebar();
  return h;
}
function card(p){
  const on=S.picked.has(p.id),hi=hasRating(p)&&p.r>=4.5;
  return `<article class="card ${on?"sel":""}"><span class="rank">${p.rank}位</span>${on?`<span class="selbadge">選択中${sp("#41-6")}</span>`:""}
   ${hi?`<span class="badge">高評価の商品${sp("SP-03 4.5以上")}</span>`:""}
   <div class="img" role="img" aria-label="商品イメージ（仮）"></div>
   <div class="name">${esc(p.name)}</div><div class="price">${yen(p.price)}${TAX}</div>
   <p class="reason">${esc(p.reason)}${sp("SP-03")}</p>
   <label class="pick"><input type="checkbox" data-pick="${p.id}" ${on?"checked":""}> ${on?"選んでいます（外す）":"選ぶ"}</label></article>`;
}
function chosenHTML(){
  const a=[...S.picked.values()];
  return `<section class="chosen" aria-label="選んだ候補"><b>選んだ候補（${a.length}件）</b>${sp("SP-04 #39-3")}
   ${a.length?`<ul>${a.map(p=>`<li><span class="nm">${esc(p.name)}</span><span>${yen(p.price)}${TAX}</span><button class="ghost" data-unpick="${p.id}" aria-label="${esc(p.name)}を外す">外す</button></li>`).join("")}</ul>`:`<div style="font-size:13px;color:var(--sub);margin-top:6px">まだ選んでいません。</div>`}</section>`;
}
function sharebar(){
  const n=S.picked.size, over=n>10, dis=n===0||over||S.creating;
  let h=`<div class="sharebar">${over?`<div class="overmsg" role="alert">共有リンクに入れられるのは10件までです。選ぶ数を減らしてください${sp("#36 N-06")}</div>`:""}
   <button class="primary" id="mk" ${dis?"disabled":""}>${S.creating?"作成中…":"共有リンクを作る"}</button>${sp("SP-05")}
   <span style="font-size:13px" role="status" aria-live="polite">選択中：${n}件</span>${n===0&&!S.creating?`<span style="font-size:12px;color:var(--sub)">1つ以上選ぶと作れます</span>`:""}`;
  if(S.mkErr) h+=`<div class="msgbox err" style="flex-basis:100%;margin:0" role="alert">失敗しました。もう一度お試しください <button class="ghost" id="mk2">再試行</button>${sp("SP-05 失敗")}</div>`;
  if(S.link) h+=`<div class="linkbox"><div class="linkrow"><code id="lk">${esc(S.link)}</code><button class="primary" id="cp">コピー</button>${sp("SP-05 #32-6・#33")}</div>
   <div class="copymsg ${S.copyMsg?S.copyMsg.k:""}" role="status" aria-live="polite">${S.copyMsg?esc(S.copyMsg.t):""}</div>
   <button class="ghost" id="openMine">この共有リンクを開いてみる</button>${note(0)}</div>`;
  return h+"</div>";
}
function shareHTML(){
  let h=`<h1>共有された贈りもの候補${sp("SP-06")}</h1>`;
  const st=S.shState;
  if(st==="load") return h+`<div class="msgbox empty" role="status">${spinnerHTML()}読み込み中…${sp("読み込み中")}</div>`;
  if(st==="fail") return h+`<div class="msgbox err" role="alert">失敗しました。もう一度お試しください<br><button class="ghost" id="shRetry" style="margin-top:8px">再試行</button>${sp("SP-06 失敗")}</div>`;
  if(st==="nf") return h+`<div class="msgbox empty" role="status">リンクが見つかりません${sp("SP-06")}</div>`;
  if(st==="exp") return h+`<div class="msgbox empty" role="status">このリンクは期限切れです<br><span style="font-size:13px">作った人に、新しいリンクを頼んでください</span>${sp("SP-06 #37-3")}</div>`;
  const items=S.shItems||[];
  return h+`<div class="shbar">作成時点の商品名・価格です。${sp("SP-06 #37")}</div>
   <div class="grid">${items.map(it=>{
     const cur=PRODUCTS.find(p=>p.id===it.id);
     const nt=!cur?`<span class="note end">この商品は販売終了しました</span>${sp("SP-06 #32-5")}`:cur.stock===0?`<span class="note out">在庫なし</span>${sp("SP-06 #32-5")}`:"";
     return `<article class="card"><div class="img" role="img" aria-label="商品イメージ（仮）"></div><div class="name">${esc(it.name)}</div><div class="price">${yen(it.price)}${TAX}</div>${nt?`<div>${nt}</div>`:""}<p class="reason">${esc(it.reason)}${sp("SP-03")}</p></article>`}).join("")}</div>
   <p class="small12">このページはリンクを知っている人なら誰でも見られます${sp("N-15")}</p>`;
}
/* 操作 */
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2000)}
function keepInput(){const b=$("#bud");if(b)S.budgetRaw=b.value}
function bind(){
  document.querySelectorAll("[data-scene]").forEach(b=>b.onclick=()=>{keepInput();S.scene=b.dataset.scene;S.sceneErr=false;if(S.st==="invalid")S.st="initial";render()});
  const f=$("#f"); if(f) f.onsubmit=e=>{e.preventDefault();keepInput();doSearch()};
  document.querySelectorAll("[data-pick]").forEach(c=>c.onchange=()=>{keepInput();const id=+c.dataset.pick;if(c.checked){const p=S.items.find(x=>x.id===id);if(p)S.picked.set(id,p)}else S.picked.delete(id);render();const e=document.querySelector('[data-pick="'+id+'"]');if(e)e.focus()});
  document.querySelectorAll("[data-unpick]").forEach(c=>c.onclick=()=>{keepInput();S.picked.delete(+c.dataset.unpick);render()});
  const r=$("#retry"); if(r) r.onclick=doSearch;
  const m=$("#mk"); if(m) m.onclick=doCreate; const m2=$("#mk2"); if(m2) m2.onclick=doCreate;
  const cp=$("#cp"); if(cp) cp.onclick=doCopy;
  const om=$("#openMine"); if(om) om.onclick=()=>openShare(S.shId);
  const sr=$("#shRetry"); if(sr) sr.onclick=()=>openShare(S.shId);
}
function doSearch(){
  const b=parseBudget(S.budgetRaw);
  S.sceneErr=!S.scene;
  if(Number.isNaN(b)||!S.scene){S.st=Number.isNaN(b)?"invalid":(S.st==="invalid"?"initial":S.st);render();return}
  const tk=++S.token; S.st="loading";render();
  request(()=>rank(b,S.scene)).then(items=>{ if(tk!==S.token)return; S.items=items;S.st=items.length?"results":"empty";render() })
   .catch(()=>{ if(tk!==S.token)return; S.st="error";render() });
}
function doCreate(){
  if(S.picked.size===0||S.picked.size>10||S.creating)return;
  S.creating=true;S.mkErr=false;S.copyMsg=null;render();
  const ids=[...S.picked.keys()];const tk=++S.token;
  request(()=>{const id=rid();store[id]={created:Date.now(),items:snap(ids)};return id})
   .then(id=>{if(tk!==S.token)return;S.creating=false;S.shId=id;S.link="https://giftia.example/s/"+id;render()})
   .catch(()=>{if(tk!==S.token)return;S.creating=false;S.mkErr=true;render()});
}
async function doCopy(){
  clearTimeout(doCopy.t);
  try{
    if($("#fCopy").checked) throw new Error("denied");
    await navigator.clipboard.writeText(S.link);
    S.copyMsg={k:"ok",t:"コピーしました"};render();
    doCopy.t=setTimeout(()=>{S.copyMsg=null;render()},2000);
  }catch(e){ S.copyMsg={k:"ng",t:"コピーできませんでした。リンクを長押ししてコピーしてください"};render() }
}
function openShare(id){
  S.view="share";S.shId=id;S.shState="load";render();
  const tk=++S.token;
  request(()=>{const r=store[id]; if(!r) return {s:"nf"}; if(Date.now()-r.created>720*HOUR) return {s:"exp"}; return {s:"ok",items:r.items}})
   .then(r=>{if(tk!==S.token)return;S.shState=r.s;S.shItems=r.items||null;render()})
   .catch(()=>{if(tk!==S.token)return;S.shState="fail";render()});
}
/* レビューバー */
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  S.view=b.dataset.view;
  if(S.view==="share"&&!S.shItems&&S.shState==="ok"){openShare(SHID.ok)}else render()});
document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-w]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#app").classList.toggle("w375",b.dataset.w==="375")});
$("#tSp").onchange=e=>document.body.classList.toggle("show-sp",e.target.checked);
$("#tNote").onchange=e=>document.body.classList.toggle("show-note",e.target.checked);
document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{
  keepInput(); S.token++; const st=b.dataset.st; S.st=st; S.creating=false;
  if(st==="results"&&!S.items.length){S.scene=S.scene||"送別";const pb=parseBudget(S.budgetRaw);S.items=rank(Number.isNaN(pb)?4500:pb,S.scene)}
  if(st==="invalid"&&!Number.isNaN(parseBudget(S.budgetRaw))){S.budgetRaw="12"}
  render()});
document.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.sh; S.token++;
  if(k==="load"){S.shState="load";render()}
  else if(k==="fail"){S.shState="fail";S.shId=S.shId||SHID.ok;render()}
  else if(k==="mine"){openShare(S.shId)}
  else openShare(SHID[k]);
});
document.addEventListener("click",e=>{if(e.target.closest("[data-soon]"))toast("準備中です（入口だけ。R-02 は要件に未追記）")});
$("#home").onclick=()=>{S.view="search";render()};
render();
</script>
</body>
</html>

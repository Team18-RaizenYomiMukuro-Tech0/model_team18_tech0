<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>モック｜ハブの霊力ゲージ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* 色・枠・フォントは docs/hub.html に合わせる。数字はすべて架空 */
:root{--bg:#E3D8F3;--text:#2A1B3D;--sub:#3F3158;--card:#FFFFFF;--line:#2A1B3D;--band:#2A1B3D;--btxt:#FFFFFF;--m1:#FFD700;--m2:#40E0D0;--m3:#FF69B4;--m4:#FFFFFF;--btn:#2A1B3D;--btext:#FFFFFF;--bhover:#FFD700;--bhtext:#2A1B3D;--focus:#FF69B4;
--body:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 1rem/1.6 var(--body)}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
h1{font:800 1.2rem/1.4 var(--body);margin:0 0 4px}
.lead{margin:0 0 16px;color:var(--sub);font-size:.9rem}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.sw button{font:800 .9rem/1 var(--body);padding:10px 14px;border:3px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);cursor:pointer;min-height:44px}
.sw button[aria-pressed="true"]{background:var(--btn);color:var(--btext)}
.sw button:hover{background:var(--bhover);color:var(--bhtext)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* ハブ上部の帯 */
.hero{background:radial-gradient(120% 140% at 80% 0,#5b2a6e 0,#2A1B3D 55%,#1a0f2a 100%);border:3px solid var(--line);border-radius:16px;padding:16px 16px 18px;color:#fff;box-shadow:4px 4px 0 var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin:0 0 12px}
.top h2{font:800 1.05rem/1.3 var(--body);margin:0;letter-spacing:.04em}
.pw{font:800 .95rem/1.3 var(--body);color:#2A1B3D;background:var(--m1);border:2px solid #fff;border-radius:999px;padding:3px 12px;white-space:nowrap}
.pw b{font-size:1.15em}
.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0;padding:0;list-style:none}
.g{--c:var(--m1);position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 6px 12px;border:2px solid rgba(255,255,255,.35);border-radius:14px;background:rgba(255,255,255,.05)}
.g[data-n="2"]{--c:var(--m2)}.g[data-n="3"]{--c:var(--m3)}.g[data-n="4"]{--c:var(--m4)}
.g.today{border-color:#fff;animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 0%,transparent)}50%{box-shadow:0 0 18px 4px color-mix(in srgb,var(--c) 70%,transparent)}}
.no{font:800 .72rem/1 var(--body);letter-spacing:.12em;color:var(--c)}
.nm{font:800 1rem/1.3 var(--body);margin:0;color:#fff}
.sub{font-size:.72rem;line-height:1.4;color:rgba(255,255,255,.8);margin:0}
/* 門＝アーチ。下から光が満ちる */
.door{position:relative;width:min(100%,104px);height:132px;border:3px solid #fff;border-bottom-width:4px;border-radius:52px 52px 6px 6px;background:rgba(0,0,0,.45);overflow:hidden;margin:2px 0}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--c),color-mix(in srgb,var(--c) 45%,#fff));transition:height .9s cubic-bezier(.2,.8,.2,1)}
.fill::after{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;background:radial-gradient(closest-side,rgba(255,255,255,.9),transparent);opacity:.8}
.chg{position:absolute;left:0;right:0;height:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,transparent) 0 6px,transparent 6px 12px);border-top:2px dashed var(--c);animation:blink 1.2s ease-in-out infinite;transition:height .9s,bottom .9s}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 1.5rem/1 var(--body);color:#fff;text-shadow:0 0 4px #000,0 0 8px #000}
.g[data-n="4"] .pct{text-shadow:0 0 4px #000,0 0 8px #000,0 0 2px #000}
.tier{font:800 .88rem/1.3 var(--body);color:var(--c);margin:0}
.next{font-size:.78rem;line-height:1.4;margin:0;color:#fff}
.next b{font-size:1.1em;color:var(--c)}
.tag{display:inline-block;font:800 .8rem/1 var(--body);padding:4px 10px;border-radius:999px;background:var(--c);color:#2A1B3D;border:2px solid #fff}
.lock{display:none}
.g.locked{opacity:.55;filter:grayscale(.5)}
.g.locked .lock{display:inline-block}
.key{display:inline-block;font-size:1.05rem;line-height:1}
.g.open-now .key{animation:unlock 1.2s ease-out 1}
@keyframes unlock{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-25deg) scale(1.4)}60%{transform:rotate(15deg) scale(1.2)}100%{transform:rotate(0) scale(1)}}
.g.flash .door::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:flash .9s ease-out 1}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.note{margin:14px 0 0;font-size:.78rem;color:var(--sub)}
.legend{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--sub)}
.legend i{display:inline-block;width:14px;height:10px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.legend .a{background:linear-gradient(to top,var(--m3),#fff)}
.legend .b{background:repeating-linear-gradient(135deg,var(--m3) 0 3px,transparent 3px 6px)}
@media(max-width:700px){.gates{grid-template-columns:1fr 1fr;gap:10px}.door{height:112px}.nm{font-size:.78rem;word-break:keep-all}.no{font-size:.68rem}}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
 .g.today{box-shadow:0 0 0 3px var(--c)}
 .chg{opacity:1}
}
</style>
</head>
<body>
<main class="wrap">
<h1>ハブ上部「霊力ゲージ」モック</h1>
<p class="lead">STAGE 1〜4 のボタンを、閉じた Issue の割合で光が満ちる4つの門にする案。数字はすべて架空です（本番は progress-summary.json の phases を使う想定）。</p>
<ul class="sw" aria-label="状態の切り替え"><li><button type="button" data-s="0" aria-pressed="false">0%（始まり）</button></li><li><button type="button" data-s="40" aria-pressed="true">40%（進行中）</button></li><li><button type="button" data-s="100" aria-pressed="false">100%（全部そろった）</button></li></ul>

<section class="hero" aria-label="霊力ゲージ">
 <div class="top"><h2>開発の霊力 <span id="today-d" style="font-weight:500;font-size:.85em"></span></h2><span class="pw" id="pw"></span></div>
 <ol class="gates" id="gates"></ol>
 <ul class="legend"><li><i class="a"></i>閉じた Issue</li><li><i class="b"></i>溜め中（PR は合流済み・Issue はまだ開いている）</li></ul>
</section>
<p class="note">段階: 0–24% 霊気 / 25–49% 霊丸 / 50–74% 霊光波動 / 75–99% 魔族覚醒 / 100% 覚醒。「◯◯まで N%」は、次の段階に入るまでの残りのパーセントポイント。前の門が 100% になるまで次の門は封印中。</p>
</main>

<script type="application/json" id="data">
{
 "gates":[
  {"n":1,"name":"霊界探偵","orig":"5文書","w":"W1","range":"〜11/7"},
  {"n":2,"name":"暗黒武術会","orig":"実装①","w":"W2","range":"11/8〜11/11"},
  {"n":3,"name":"魔界の扉","orig":"実装②","w":"W3","range":"11/12〜11/15"},
  {"n":4,"name":"魔界統一トーナメント","orig":"評価・受入","w":"W4","range":"11/16〜11/21"}
 ],
 "states":{
  "0":  {"today":"11/7","todayGate":1,"power":0,"phases":[{"closed":0,"total":12,"merged":0},{"closed":0,"total":10,"merged":0},{"closed":0,"total":10,"merged":0},{"closed":0,"total":8,"merged":0}]},
  "40": {"today":"11/9","todayGate":2,"power":5,"phases":[{"closed":12,"total":12,"merged":0},{"closed":4,"total":10,"merged":2},{"closed":0,"total":10,"merged":0},{"closed":0,"total":8,"merged":0}]},
  "100":{"today":"11/21","todayGate":4,"power":9,"phases":[{"closed":12,"total":12,"merged":0},{"closed":10,"total":10,"merged":0},{"closed":10,"total":10,"merged":0},{"closed":8,"total":8,"merged":0}]}
 }
}
</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var TIERS=[[0,'霊気'],[25,'霊丸'],[50,'霊光波動'],[75,'魔族覚醒'],[100,'覚醒']];
function tierOf(p){var i=0;for(var k=0;k<TIERS.length;k++)if(p>=TIERS[k][0])i=k;return i}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var prev=null;
function render(key){
 var st=D.states[key],box=document.getElementById('gates');
 box.textContent='';
 var pcts=st.phases.map(function(p){return Math.round(p.closed/p.total*100)});
 var prevPcts=prev?D.states[prev].phases.map(function(p){return Math.round(p.closed/p.total*100)}):null;
 D.gates.forEach(function(g,i){
  var ph=st.phases[i],pct=pcts[i],locked=i>0&&pcts[i-1]<100;
  var ti=tierOf(pct),done=pct>=100;
  var li=el('li','g'+(g.n===st.todayGate?' today':'')+(locked?' locked':''));
  li.dataset.n=g.n;
  var wasDone=prevPcts&&prevPcts[i]>=100,wasLocked=prevPcts&&i>0&&prevPcts[i-1]<100;
  if(done&&!wasDone)li.classList.add('flash');
  if(!locked&&wasLocked)li.classList.add('open-now');
  var charge=Math.min(Math.round(ph.merged/ph.total*100),100-pct);
  var label=g.name+'、'+(locked?'封印中':(done?'覚醒':TIERS[ti][1]+'、次の段階まであと'+(TIERS[ti+1][0]-pct)+'パーセント'))+'。閉じた Issue '+ph.closed+'/'+ph.total+(ph.merged?'、溜め中 '+ph.merged:'');
  li.setAttribute('role','group');li.setAttribute('aria-label',label);
  li.appendChild(el('span','no','GATE '+g.n));
  li.appendChild(el('h3','nm',g.name));
  li.lastChild.style.margin='0';
  var door=el('div','door'),f=el('div','fill'),c=el('div','chg');
  door.appendChild(f);door.appendChild(c);
  door.appendChild(el('div','pct',pct+'%'));
  li.appendChild(door);
  if(locked){
   var p0=el('p','tier');var k=el('span','key lock','🔒');k.setAttribute('aria-hidden','true');p0.appendChild(k);p0.appendChild(document.createTextNode(' 封印中'));
   li.appendChild(p0);
   li.appendChild(el('p','next','門'+(g.n-1)+'が覚醒したら開く'));
  }else if(done){
   var p1=el('p','tier');p1.appendChild(el('span','tag','覚醒'));li.appendChild(p1);
   li.appendChild(el('p','next',g.n<4?'次の門の鍵が外れた':'全部の門が開いた'));
  }else{
   li.appendChild(el('p','tier',TIERS[ti][1]));
   var n=el('p','next');n.appendChild(document.createTextNode(TIERS[ti+1][1]+'まで '));n.appendChild(el('b',null,(TIERS[ti+1][0]-pct)+'%'));
   li.appendChild(n);
  }
  li.appendChild(el('p','sub',g.orig+'（'+g.w+' '+g.range+'）'));
  box.appendChild(li);
  // 一度 0 にしてから伸ばす（満ちる動き）
  requestAnimationFrame(function(){requestAnimationFrame(function(){
   f.style.height=pct+'%';c.style.bottom=pct+'%';c.style.height=charge+'%';
  })});
 });
 document.getElementById('pw').textContent='';
 var pw=document.getElementById('pw');pw.appendChild(document.createTextNode('今日 +'));pw.appendChild(el('b',null,String(st.power)));pw.appendChild(document.createTextNode(' 霊力'));
 document.getElementById('today-d').textContent='（今日 '+st.today+'・架空）';
 prev=key;
}
var btns=document.querySelectorAll('.sw button');
btns.forEach(function(b){b.addEventListener('click',function(){
 btns.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
 render(b.dataset.s);
})});
var h=location.hash.slice(1);if(!D.states[h])h='40';
btns.forEach(function(x){x.setAttribute('aria-pressed',x.dataset.s===h?'true':'false')});
render(h);
})();
</script>
</body>
</html>
